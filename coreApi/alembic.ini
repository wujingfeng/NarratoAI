[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# 仅供本地迁移验证；部署时必须通过 CORE_API_DATABASE_URL 覆盖为 PostgreSQL。
sqlalchemy.url = sqlite:////private/tmp/narrato_core_api_task4.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
