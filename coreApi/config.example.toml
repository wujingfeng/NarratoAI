# 复制为部署机上的私有配置文件，并将文件权限设为 0600。
database_url = "postgresql+psycopg://narrato_core:replace-me@127.0.0.1:5432/narrato_core"
redis_url = "redis://127.0.0.1:6379/2"
redis_key_prefix = "narrato:core:"
celery_broker_url = "redis://127.0.0.1:6379/3"
celery_queue_prefix = "narrato.core"
service_token = "replace-with-core-service-token"
callback_token = "replace-with-core-callback-token"
callback_url = "https://api.example.com/api/v1/internal/core/callbacks"
callback_connect_timeout_seconds = 3.0
callback_read_timeout_seconds = 10.0
callback_total_timeout_seconds = 15.0
oss_endpoint = "oss-cn-example.aliyuncs.com"
oss_bucket = "replace-with-core-bucket"
oss_access_key_id = "replace-with-oss-access-key-id"
oss_access_key_secret = "replace-with-oss-access-key-secret"
oss_public_base_url = "https://cdn.example.com"
cdn_allowed_hosts = ["cdn.example.com"]
asr_local_api_url = "http://127.0.0.1:7860"
download_connect_timeout_seconds = 5.0
download_read_timeout_seconds = 30.0
download_total_timeout_seconds = 120.0
readiness_timeout_seconds = 3.0
log_level = "INFO"
work_root = "/var/lib/narrato/core"

# 数据库仅保存下列键名引用，真实值只存在权限为 0600 的私有 TOML 中。
[provider_secrets]
volcengine = "replace-with-volcengine-secret"
aliyun = "replace-with-aliyun-secret"
