# 复制为部署机上的私有配置文件，并将文件权限设为 0600。
# PostgreSQL 数据库连接地址，包含驱动、账号、主机、端口和数据库名。
database_url = "postgresql+psycopg://narrato_core:replace-me@127.0.0.1:5432/narrato_core"
# Redis 连接地址；不同服务应使用独立数据库编号。
redis_url = "redis://127.0.0.1:6379/2"
# 该服务写入 Redis 键时使用的统一前缀，用于命名空间隔离。
redis_key_prefix = "narrato:core:"
# Celery 消息代理连接地址，用于投递异步任务。
celery_broker_url = "redis://127.0.0.1:6379/3"
# Celery 任务队列名称前缀，用于与其他服务的 Worker 隔离。
celery_queue_prefix = "narrato.core"
# Core API 内部服务鉴权令牌，调用方必须携带匹配的值。
service_token = "replace-with-core-service-token"
# Core 回调到 Business API 时使用的内部鉴权令牌。
callback_token = "replace-with-core-callback-token"
# Core API 向 Business API 推送任务状态和结果的回调地址。
callback_url = "https://api.example.com/api/v1/internal/core/callbacks"
# 连接回调地址的最长等待时间（秒）。
callback_connect_timeout_seconds = 3.0
# 读取回调响应的最长等待时间（秒）。
callback_read_timeout_seconds = 10.0
# 单次回调请求的总超时时间（秒）。
callback_total_timeout_seconds = 15.0
# 阿里云 OSS Endpoint 域名，不包含协议和 Bucket 名称。
oss_endpoint = "oss-cn-example.aliyuncs.com"
# 存储业务媒体文件的 OSS Bucket 名称。
oss_bucket = "replace-with-core-bucket"
# 访问 OSS 所使用的 AccessKey ID。
oss_access_key_id = "replace-with-oss-access-key-id"
# 访问 OSS 所使用的 AccessKey Secret。
oss_access_key_secret = "replace-with-oss-access-key-secret"
# 对象对外访问时使用的 CDN 公网基础地址。
cdn_public_base_url = "https://cdn.example.com"
# 允许作为受信任 CDN 资源来源的主机名白名单。
cdn_allowed_hosts = ["cdn.example.com"]
# 火山方舟 Chat Completions 的 OpenAI 兼容基础地址，须包含 /api/v3。
volcengine_ark_base_url = "https://ark.cn-beijing.volces.com/api/v3"
# 火山方舟 API Key；仅填写在权限为 0600 的私有配置中。
volcengine_ark_api_key = "replace-with-volcengine-ark-api-key"
# 火山方舟控制台创建的 Endpoint ID 或模型 ID。Core 不在代码或数据库中写死该值。
volcengine_ark_model_id = "replace-with-volcengine-ark-model-id"
# local: 部署机 FunASR；volcengine: 直接提交受 CDN 白名单保护的视频 URL。
# 语音识别服务提供方；可选本地服务或 volcengine。
asr_provider = "local"
# 本地 ASR 服务的 HTTP 接口地址，仅 local 提供方使用。
asr_local_api_url = "http://127.0.0.1:7860"
# 火山引擎语音识别应用 ID。
volcengine_asr_appid = "replace-with-volcengine-appid"
# 火山引擎语音识别访问令牌。
volcengine_asr_token = "replace-with-volcengine-access-token"
# 火山引擎语音识别使用的集群标识。
volcengine_asr_cluster = "volc_auc_video"
# 轮询火山引擎 ASR 异步任务状态的间隔（秒）。
volcengine_asr_poll_interval_seconds = 2.0
# 等待火山引擎 ASR 异步任务完成的总超时时间（秒）。
volcengine_asr_total_timeout_seconds = 600.0
# 提交给火山引擎 ASR 的默认识别语言代码。
volcengine_asr_language = "zh-CN"
# 是否启用逆文本规范化，将数字等口语形式转为规范文本。
volcengine_asr_use_itn = true
# 是否在识别结果中生成标点符号。
volcengine_asr_use_punc = true
# 是否请求说话人区分信息。
volcengine_asr_with_speaker_info = false
# 火山必须能从公网访问该 HTTPS 域名，不能填写 localhost。
# 火山引擎回调 Core API 时使用的可公网访问基础地址。
volcengine_asr_callback_base_url = "https://core.example.com"
# 下载远程媒体文件时建立连接的最长等待时间（秒）。
download_connect_timeout_seconds = 5.0
# 下载远程媒体文件时单次读取的最长等待时间（秒）。
download_read_timeout_seconds = 30.0
# 下载单个远程媒体文件的总超时时间（秒）。
download_total_timeout_seconds = 120.0
# 服务就绪检查请求的超时时间（秒）。
readiness_timeout_seconds = 3.0
# 服务日志输出级别，例如 DEBUG、INFO、WARNING 或 ERROR。
log_level = "INFO"
# Core API 处理媒体任务时使用的本地工作目录。
work_root = "/var/lib/narrato/core"

# 数据库仅保存下列键名引用，真实值只存在权限为 0600 的私有 TOML 中。
[provider_secrets]
# 火山引擎供应商密钥配置；实际格式由对应 Provider 解析。
volcengine = "replace-with-volcengine-secret"
# 阿里云供应商密钥配置；实际格式由对应 Provider 解析。
aliyun = "replace-with-aliyun-secret"
