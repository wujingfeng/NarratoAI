[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "narrato-core-api"
version = "0.1.0"
description = "NarratoAI Core API service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "celery>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "loguru>=0.7,<1",
  "openai>=1.77,<2",
  "oss2>=2.19,<3",
  "pillow>=10.3,<12",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<6",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0,<3",
  "toml>=0.10,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = [".", "vendor_legacy"]
include = ["core_api*", "app", "app.services"]
