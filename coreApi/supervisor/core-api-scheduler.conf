; Publishes Core recovery, callback-outbox, and artifact-reconciliation schedules.
; It never consumes a Celery worker queue.
[program:core-api-scheduler]
directory=/srv/narrato/NarratoAI/coreApi
command=/srv/narrato/NarratoAI/coreApi/.venv/bin/celery -A core_api.celery_app:celery_app beat --loglevel=INFO --pidfile=/run/narrato-core-api/scheduler.pid --schedule=/var/lib/narrato-core-api/celerybeat-schedule
environment=CORE_API_CONFIG="/etc/narrato-core-api/core-api.toml",PYTHONPATH="/srv/narrato/NarratoAI"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/narrato-core-api/scheduler.stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/var/log/narrato-core-api/scheduler.stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
