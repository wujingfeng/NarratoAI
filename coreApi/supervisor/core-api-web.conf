; Core HTTP process. The private TOML is provisioned outside this repository.
[program:core-api-web]
directory=/srv/narrato/NarratoAI/coreApi
command=/srv/narrato/NarratoAI/coreApi/.venv/bin/uvicorn core_api.main:create_app --factory --host 127.0.0.1 --port 8002
environment=CORE_API_CONFIG="/etc/narrato-core-api/core-api.toml",PYTHONPATH="/srv/narrato/NarratoAI"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/narrato-core-api/web.stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/var/log/narrato-core-api/web.stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
