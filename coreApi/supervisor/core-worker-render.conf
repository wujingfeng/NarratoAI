; Dedicated Core Celery queue(s); ASR never consumes the default queue.
[program:core-worker-render]
directory=/srv/narrato/NarratoAI/coreApi
command=/srv/narrato/NarratoAI/coreApi/.venv/bin/celery -A core_api.celery_app:celery_app worker --loglevel=INFO --queues=narrato.core.render --hostname=core-render@%%h --concurrency=1
environment=CORE_API_CONFIG="/etc/narrato-core-api/core-api.toml",PYTHONPATH="/srv/narrato/NarratoAI"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=300
stdout_logfile=/var/log/narrato-core-api/worker-render.stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/var/log/narrato-core-api/worker-render.stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
