; Capacity label for TTS work. Current Core wake tasks all route to one durable
; narrato.core.default queue, so this process deliberately consumes that real queue.
[program:core-worker-tts]
directory=/srv/narrato/NarratoAI/coreApi
command=/srv/narrato/NarratoAI/coreApi/.venv/bin/celery -A core_api.celery_app:celery_app worker --loglevel=INFO --queues=narrato.core.default --hostname=core-tts@%%h --concurrency=2
environment=CORE_API_CONFIG="/etc/narrato-core-api/core-api.toml",PYTHONPATH="/srv/narrato/NarratoAI"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/var/log/narrato-core-api/worker-tts.stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/var/log/narrato-core-api/worker-tts.stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
