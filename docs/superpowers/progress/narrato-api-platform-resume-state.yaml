key_decisions:
  - "Task 15A provides permanent waiting, render locking, immutable revision snapshots, and one render-request Outbox boundary only."
  - "Task 15B adds one EditorDraft per project; ordered saves overwrite its content under last-write-wins semantics."
  - "Task 15C provides only a terminal deletion eligibility guard: completed/failed pass, all non-terminal states raise PROJECT_NOT_TERMINAL, and no deletion occurs."
  - "Task 15D provides only a service-layer visibility guard: completed projects retain their registered artifact sequence; failed and all other statuses expose an empty list."
  - "Task 15D deliberately creates no artifact entity, export endpoint, Jianying generation, router, Core call, or downstream behavior."
  - "Task 15E provides only an export eligibility boundary: completed passes; failed and every non-completed state raise PROJECT_NOT_COMPLETED."
  - "Task 15E deliberately does not create an artifact entity, generate an export/Jianying package, or provide router, Core, or downstream behavior."
  - "Task 15F defines RegisteredArtifact with only id, project_id, kind, cdn_url, and created_at; projects retain RESTRICT ownership and artifacts are indexed by project_id plus created_at."
  - "Task 15F does not register artifacts from Core, query visibility, expose results, generate exports/Jianying, or add a router."
  - "Task 15G provides register_artifact(session, ...) only: it creates a RegisteredArtifact with session.add and leaves commit/rollback to the caller transaction."
  - "Task 15G does not verify project ownership/existence, reconcile Core, query visibility, expose results, generate exports/Jianying, or add a router."
  - "Task 15C does not implement artifacts/results, export/Jianying, router, Core calls, downstream execution, or another Task 15 boundary."
remaining_risks:
  - "SQLite tests cover persistence boundaries but real PostgreSQL multi-connection/row-lock behavior remains unverified."
  - "Real OSS/Core integration remains unverified."
  - "Project-wide mypy still has 6 existing assets-module errors outside these tasks."
  - "Focused pytest commands require PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 because default plugin loading is unreliable in this environment."
  - "The visibility guard is a service boundary only; future real result/export read paths must use it when those task boundaries are implemented."
  - "The export eligibility guard is a service boundary only; future export entry points must call it when those task boundaries are implemented."
  - "RegisteredArtifact.kind is intentionally unconstrained so later product-approved artifact kinds can be added without prematurely fixing an enum."
  - "Artifact registration callers must establish ownership and Core-result validity before calling the minimal registration boundary."
