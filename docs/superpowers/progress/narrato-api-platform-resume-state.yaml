key_decisions:
  - "CreatePage only exposes the existing recovered project lifecycle API; it does not synthesize a local fee fallback."
  - "The Create start control remains disabled for non-ready assets and while cost estimation is pending or rejected."
  - "Completed result data is only rendered after the completion-gated result API succeeds; rejected result requests render no export controls."
  - "The Task 17 editor UI is intentionally a content-draft page rather than a custom media editor, avoiding unsupported timeline/media behavior until real duration and track data exist."
  - "User explicitly accepted the authentic API/browser/FSA invocation and streamed ZIP evidence as sufficient for Gate C despite absent visible native-picker selection capture."
  - "Task 19A uses fixed /srv/narrato/NarratoAI and /etc/narrato-api paths as deployment conventions; provisioning belongs to the host deployment step."
  - "Core role-named workers all consume narrato.core.default because durable wake tasks are not currently routed to role-specific queues; runbooks call this out explicitly."
  - "Task 20A verifies shared in-service protocol helpers only; cross-service HTTP contract evolution remains a later slice."
  - "Task 20B receives Core callbacks only on the Business internal route with core_callback_token; it never reuses core_request_token, and event_id must agree with X-Idempotency-Key before reconciliation."
remaining_risks:
  - "Asset completion does not yet persist probe duration, so real uploads without duration fail safely with PROJECT_DURATION_UNAVAILABLE rather than being charged or started."
  - "Native macOS save-picker visibility and user-selected destination completion were not captured; accepted as a Gate C evidence exception and retained as a residual rollout verification item."
  - "Vite reports an existing >500 kB output chunk advisory."
  - "nginx -t was not runnable in the macOS sandbox because of sysctl/log-directory permissions; deployment host must execute it."
  - "Task 20 static acceptance remains blocked by pre-existing ruff format drift and 9 Business mypy errors; real provider smoke is unconfigured."
