key_decisions:
  - "Task 14A contains only the versioned short-drama DAG template and pure state-machine rules."
  - "Task 14B stores template snapshots, workflow instances, nodes, node attempts, and Outbox records only; it does not implement workflow runtime behavior."
  - "Task 14C instantiates Workflow and WorkflowNode records from an immutable WorkflowTemplateSnapshot in one transaction."
  - "Task 14C applies only allowed workflow state transitions and appends one idempotent workflow.state_changed Outbox event in the same transaction."
  - "User cancellation and manual retry remain rejected; waiting_for_edit does not auto-timeout or auto-fail."
  - "Task 14D persists Core terminal result event facts per node attempt and accepts callback and polling only through the same transaction."
  - "A terminal event applies only when its state_version is newer than the attempt; duplicate event IDs and stale/equal versions leave node and workflow state unchanged."
  - "Task 14D does not dispatch downstream work, perform refunds, add Celery, router, SSE, or Task 15 behavior."
remaining_risks:
  - "Task 14E still needs durable Outbox claim and dispatch wake-up behavior; database re-delivery scanning, router, SSE, and Task 15 remain unimplemented."
  - "Real OSS/Core integration and PostgreSQL multi-connection behavior remain unverified."
  - "Focused pytest commands require PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 because default plugin loading is not reliable in this environment."
