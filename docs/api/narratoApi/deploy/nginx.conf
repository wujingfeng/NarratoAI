# Self-contained, host-level Nginx example for the Narrato API platform.
# Replace the two allowed origins before deployment.  This file intentionally
# listens on 8080 so `nginx -t -c ...` is safe to run without privileged ports.

worker_processes 1;
pid /tmp/narrato-api-nginx.pid;
error_log /tmp/narrato-api-nginx.error.log notice;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    log_format narrato '$remote_addr - $request_method $uri $status $body_bytes_sent';
    access_log /tmp/narrato-api-nginx.access.log narrato;

    # Coarse edge protection. Redis remains responsible for per-user limits.
    limit_req_zone $binary_remote_addr zone=narrato_api_per_ip:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=narrato_api_connections_per_ip:10m;

    # Keep this allowlist in sync with the deployed Web Origin; never reflect
    # arbitrary Origin request headers when credentials are accepted.
    map $http_origin $cors_origin {
        default "";
        "https://app.example.com" $http_origin;
        "https://www.example.com" $http_origin;
        "http://localhost:5280" $http_origin;
    }

    upstream narrato_business_api {
        server 127.0.0.1:8001;
        keepalive 32;
    }

    upstream narrato_core_api {
        server 127.0.0.1:8002;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        # Signed client uploads go directly to OSS, but API JSON and upload
        # confirmations must still be bounded at the edge.
        client_max_body_size 512m;
        client_body_timeout 60s;
        send_timeout 300s;

        location /api/v1/ {
            limit_req zone=narrato_api_per_ip burst=20 nodelay;
            limit_conn narrato_api_connections_per_ip 20;

            # Browser preflight for the known Web Origin only.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Last-Event-ID, X-Request-ID, Range" always;
                add_header Access-Control-Max-Age 600 always;
                add_header Content-Length 0;
                return 204;
            }

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Vary "Origin" always;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            # Required for durable project-event SSE streams.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_pass http://narrato_business_api;
        }

        # Core is usually called by the Business API over loopback. This route
        # exists for controlled operational access and strips /core-api/.
        location /core-api/ {
            limit_req zone=narrato_api_per_ip burst=10 nodelay;
            limit_conn narrato_api_connections_per_ip 10;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID" always;
                add_header Access-Control-Max-Age 600 always;
                add_header Content-Length 0;
                return 204;
            }

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Vary "Origin" always;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_pass http://narrato_core_api/;
        }
    }

    # OSS/CDN CORS policy example (configure this on the bucket or CDN rule,
    # not as an Nginx response):
    # AllowedOrigin: https://app.example.com
    # AllowedMethod: GET, HEAD
    # AllowedHeader: Range
    # ExposeHeader: Accept-Ranges, Content-Length, Content-Range, ETag
}
