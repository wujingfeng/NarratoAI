; Business API HTTP process.  The production TOML is provisioned outside this repository.
[program:narrato-api-web]
directory=/srv/narrato/NarratoAI/docs/api/narratoApi
command=/srv/narrato/NarratoAI/docs/api/narratoApi/.venv/bin/uvicorn narrato_api.main:create_app --factory --host 127.0.0.1 --port 8001
environment=NARRATO_API_CONFIG="/etc/narrato-api/narrato-api.toml"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/narrato-api/web.stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/var/log/narrato-api/web.stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
