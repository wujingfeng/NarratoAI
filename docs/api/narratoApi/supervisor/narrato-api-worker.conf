; Consumes only the Business API default queue for asynchronous business work.
[program:narrato-api-worker]
directory=/srv/narrato/NarratoAI/docs/api/narratoApi
command=/srv/narrato/NarratoAI/docs/api/narratoApi/.venv/bin/celery -A narrato_api.celery_app:celery_app worker --loglevel=INFO --queues=narrato.business.default
environment=NARRATO_API_CONFIG="/etc/narrato-api/narrato-api.toml"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/var/log/narrato-api/worker.stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/var/log/narrato-api/worker.stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
