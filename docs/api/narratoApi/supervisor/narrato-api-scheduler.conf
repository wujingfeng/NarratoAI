; Emits periodic schedules only; it never consumes a Celery worker queue.
[program:narrato-api-scheduler]
directory=/srv/narrato/NarratoAI/docs/api/narratoApi
command=/srv/narrato/NarratoAI/docs/api/narratoApi/.venv/bin/celery -A narrato_api.celery_app:celery_app beat --loglevel=INFO --pidfile=/run/narrato-api/scheduler.pid --schedule=/var/lib/narrato-api/celerybeat-schedule
environment=NARRATO_API_CONFIG="/etc/narrato-api/narrato-api.toml"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/narrato-api/scheduler.stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/var/log/narrato-api/scheduler.stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
